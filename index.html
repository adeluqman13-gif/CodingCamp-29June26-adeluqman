<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">

            <button id="theme-toggle" class="theme-btn">
                <i class="fas fa-moon"></i>
            </button>

            <h1>To-Do List Life Dashboard</h1>

            <p class="subtitle">
               Your Personal Productivity Hub
            </p>

        </header>
        
        <main class="dashboard-grid">
            <!-- Greeting Section -->
            <section id="greeting-section" class="dashboard-section" aria-labelledby="greeting-heading">
                <h2 id="greeting-heading" class="section-heading">
                    <i class="fas fa-sun"></i> Greeting
                </h2>
                <div class="greeting-content">
                    <div class="greeting-text" id="greeting-text"></div>
                    <div class="date-time">
                        <div class="date" id="current-date">Monday, January 01, 2024</div>
                        <div class="time" id="current-time">12:00 PM</div>
                    </div>
                </div>
            </section>
            
            <!-- Focus Timer Section -->
            <section id="timer-section" class="dashboard-section" aria-labelledby="timer-heading">
                <h2 id="timer-heading" class="section-heading">
                    <i class="fas fa-clock"></i> Focus Timer
                </h2>
                <div class="timer-content">
                    <div class="timer-display" id="timer-display">25:00</div>
                    <div class="timer-controls">
                        <button id="timer-start" class="btn btn-primary" aria-label="Start timer">
                            <i class="fas fa-play"></i> Start
                        </button>
                        <button id="timer-stop" class="btn btn-secondary" disabled aria-label="Stop timer">
                            <i class="fas fa-pause"></i> Stop
                        </button>
                        <button id="timer-reset" class="btn btn-tertiary" aria-label="Reset timer">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                    <div class="timer-status" id="timer-status">Ready to focus</div>
                </div>
            </section>
            
            <!-- To-Do List Section -->
            <section id="todo-section" class="dashboard-section" aria-labelledby="todo-heading">
                <h2 id="todo-heading" class="section-heading">
                    <i class="fas fa-tasks"></i> To-Do List
                </h2>
                <div class="progress-container">

                    <div class="progress-info">
                        <span id="progress-text">0 / 0 Tasks Completed</span>
                        <span id="progress-percent">0%</span>
                    </div>

                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>

                    </div>
                <div class="todo-content">
                    <form id="todo-form" class="todo-form">
                        <input type="text" id="todo-input" 
                               placeholder="Add a new task..." 
                               maxlength="200"
                               aria-label="New task description">
                        <button type="submit" class="btn btn-primary" aria-label="Add task">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </form>
                    <div class="todo-error" id="todo-error" role="alert" aria-live="polite"></div>
                    <ul id="todo-list" class="todo-list" aria-label="Task list">
                        <!-- Tasks will be added here dynamically -->
                    </ul>
                </div>
            </section>
            
            <!-- Quick Links Section -->
            <section id="links-section" class="dashboard-section" aria-labelledby="links-heading">
                <h2 id="links-heading" class="section-heading">
                    <i class="fas fa-link"></i> Quick Links
                </h2>
                <div class="links-content">
                    <form id="links-form" class="links-form">
                        <input type="text" id="link-name" 
                               placeholder="Link name" 
                               maxlength="50"
                               aria-label="Link name">
                        <input type="url" id="link-url" 
                               placeholder="https://example.com"
                               aria-label="Link URL">
                        <button type="submit" class="btn btn-primary" aria-label="Add link">
                            <i class="fas fa-plus"></i> Add
                        </button>
                    </form>
                    <div class="links-error" id="links-error" role="alert" aria-live="polite"></div>
                    <div id="links-list" class="links-list">
                        <!-- Links will be added here dynamically -->
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="dashboard-footer">
            <p>To-Do List Life Dashboard • Data stored locally in your browser</p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
